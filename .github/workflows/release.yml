name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1 opencv-python-headless pillow pyinstaller
          pip install rapidocr-onnxruntime==1.4.4

      - name: Build exe
        run: python -m PyInstaller FlowTap.spec --noconfirm --clean

      - name: Build onedir
        run: python -m PyInstaller FlowTap_onedir.spec --noconfirm --clean

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $iscc /DAppVersion=$ver packaging\FlowTap.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack zips
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 两个 zip 都只装一个文件, 解压即用, 不带嵌套目录。
          # zip 下载不触发 SmartScreen 对 exe 的"不建议保留"提示
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path dist\FlowTap.exe -DestinationPath "dist\FlowTap-v$ver.zip" -CompressionLevel Optimal
          Write-Output "portable zip: $((Get-Item "dist\FlowTap-v$ver.zip").Length / 1MB) MB"
          $setup = "dist\FlowTap-Setup-v$ver.exe"
          Compress-Archive -Path $setup -DestinationPath "dist\FlowTap-Setup-v$ver.zip" -CompressionLevel Optimal
          Write-Output "setup zip:    $((Get-Item "dist\FlowTap-Setup-v$ver.zip").Length / 1MB) MB"

      - name: Upload test artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: FlowTap-test
          path: |
            dist/FlowTap.exe
            dist/FlowTap-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlowTap.exe
            dist/FlowTap-v*.zip
            dist/FlowTap-Setup-*.exe
            dist/FlowTap-Setup-v*.zip
          name: FlowTap ${{ github.ref_name }}
          body: |
            下载说明

            **推荐下载 zip**，解压即用，下载时不会弹"不建议保留"。

            便携版（解压后只有一个 exe，双击运行）：
            - `FlowTap-${{ github.ref_name }}.zip`
            - `FlowTap.exe` — 不解压直接运行

            安装版（解压后只有一个安装包，双击安装）：
            - `FlowTap-Setup-${{ github.ref_name }}.zip`
            - `FlowTap-Setup-${{ github.ref_name }}.exe`

            注：exe 未做代码签名，Windows 可能提示"未知发布者"，
            这是 PyInstaller 打包程序的常见误报，点"更多信息 → 仍要运行"即可。
