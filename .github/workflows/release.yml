name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1 opencv-python-headless pillow pyinstaller
          pip install rapidocr-onnxruntime==1.4.4

      - name: Build exe
        run: python -m PyInstaller FlowTap.spec --noconfirm --clean

      - name: Build onedir
        run: python -m PyInstaller FlowTap_onedir.spec --noconfirm --clean

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $iscc /DAppVersion=$ver packaging\FlowTap.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack portable zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 便携版 zip: 240MB -> ~99MB(压缩率59%); zip 下载不触发 SmartScreen 的 exe 警告
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path dist\FlowTap -DestinationPath "dist\FlowTap-v$ver.zip" -CompressionLevel Optimal
          Write-Output "zip: $((Get-Item "dist\FlowTap-v$ver.zip").Length / 1MB) MB"

      - name: Upload test artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: FlowTap-test
          path: |
            dist/FlowTap.exe
            dist/FlowTap-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlowTap.exe
            dist/FlowTap-Setup-*.exe
            dist/FlowTap-v*.zip
          name: FlowTap ${{ github.ref_name }}
          body: |
            下载说明

            便携版解压即用：
            - `FlowTap-v${{ github.ref_name }}.zip` — **推荐**，下载时不会弹"不建议保留"
            - `FlowTap.exe` — 单文件版

            安装版：
            - `FlowTap-Setup-${{ github.ref_name }}.exe`

            注：exe 未做代码签名，Windows 可能提示"未知发布者"，
            这是 PyInstaller 打包程序的常见误报，点"更多信息 → 仍要运行"即可。
